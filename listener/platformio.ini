; Listener module: AI-Thinker ESP32-A1S (ESP32 Audio Kit v2.2, ES8388 codec).
; NOT YET BUILT OR FLASHED - written blind, expect to fix pin/board details on first build.
[env:esp32-a1s]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DDC2M_MIDI_TX_PIN=22      ; check against your board's header before wiring
    -DDC2M_SAMPLE_RATE=16000
lib_deps =
    symlink://../core
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-audio-driver.git
